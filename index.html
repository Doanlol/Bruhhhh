<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Draw</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f0f0f0;
}

.container{
background:white;
width:450px;
margin:auto;
margin-top:40px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
}

input{
padding:8px;
}

textarea{
width:90%;
height:80px;
padding:8px;
}

#result{
margin-top:20px;
font-size:20px;
color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>🎲 Lucky Draw</h2>

<input id="nameInput" placeholder="Nhập tên">

<button onclick="addName()">Thêm</button>
<button onclick="clearList()">Xóa</button>

<h3>Danh sách</h3>
<ul id="list"></ul>

<hr>

<h3>Thêm nhiều người</h3>

<textarea id="bulkInput" placeholder="Mỗi người một dòng"></textarea>
<br>
<button onclick="addBulk()">Thêm danh sách</button>

<hr>

<h3>Chế độ bốc thăm</h3>

<button onclick="drawOne()">🎯 1 người</button>
<button onclick="drawMultiple()">🎉 Nhiều người</button>
<button onclick="makeTeams()">👥 Chia team</button>

<div id="result"></div>

</div>

<script>

let names = []

function addName(){

let name = document.getElementById("nameInput").value

if(name==="") return

names.push(name)

updateList()

document.getElementById("nameInput").value=""

}

function addBulk(){

let text = document.getElementById("bulkInput").value

let arr = text.split("\n")

for(let i=0;i<arr.length;i++){

let name = arr[i].trim()

if(name!=""){
names.push(name)
}

}

updateList()

document.getElementById("bulkInput").value=""

}

function updateList(){

let list = document.getElementById("list")

list.innerHTML=""

for(let i=0;i<names.length;i++){

list.innerHTML += "<li>"+names[i]+"</li>"

}

}

function clearList(){

names=[]

updateList()

document.getElementById("result").innerHTML=""

}

function drawOne(){

if(names.length==0){

alert("Chưa có tên!")

return

}

let random = Math.floor(Math.random()*names.length)

document.getElementById("result").innerHTML =
"🎯 Người trúng: <b>"+names[random]+"</b>"

}

function drawMultiple(){

if(names.length<2){

alert("Cần ít nhất 2 người")

return

}

let winners = []

let temp = [...names]

for(let i=0;i<3 && temp.length>0;i++){

let r = Math.floor(Math.random()*temp.length)

winners.push(temp[r])

temp.splice(r,1)

}

document.getElementById("result").innerHTML =
"🎉 Người trúng: "+ winners.join(", ")

}

function makeTeams(){

if(names.length<2){

alert("Cần ít nhất 2 người")

return

}

let shuffled = [...names]

shuffled.sort(()=>Math.random()-0.5)

let team1=[]
let team2=[]

for(let i=0;i<shuffled.length;i++){

if(i%2==0){
team1.push(shuffled[i])
}else{
team2.push(shuffled[i])
}

}

document.getElementById("result").innerHTML =
"👥 Team A: "+team1.join(", ")+"<br><br>👥 Team B: "+team2.join(", ")

}

</script>
  <script src="script.js"></script>

</body>
</html>
