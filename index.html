<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Draw</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f0f0f0;
}

.container{
background:white;
width:450px;
margin:auto;
margin-top:40px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
}

input,textarea{
padding:8px;
width:80%;
}

textarea{
height:80px;
}

#result{
margin-top:20px;
font-size:20px;
color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>🎲 Lucky Draw</h2>

<input id="nameInput" placeholder="Nhập tên">

<br>

<button onclick="addName()">Thêm</button>
<button onclick="clearList()">Xóa</button>

<h3>Danh sách</h3>

<ul id="list"></ul>

<hr>

<h3>Thêm nhiều người</h3>

<textarea id="bulkInput" placeholder="Mỗi người một dòng"></textarea>

<br>

<button onclick="addBulk()">Thêm danh sách</button>

<hr>

<h3>Chế độ bốc thăm</h3>

<button onclick="drawOne()">🎯 1 người</button>
<button onclick="drawMultiple()">🎉 3 người</button>
<button onclick="makeTeams()">👥 Chia team</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
  </html>
