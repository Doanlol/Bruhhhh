<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bốc Thăm May Mắn</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f0f0f0;
}

.container{
    background:white;
    width:400px;
    margin:auto;
    margin-top:50px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

#spin{
    background:green;
    color:white;
}

#add{
    background:blue;
    color:white;
}

#clear{
    background:red;
    color:white;
}

#result{
    font-size:25px;
    margin-top:20px;
    color:green;
}
</style>
</head>

<body>

<div class="container">

<h2>🎲 Bốc Thăm May Mắn</h2>

<input id="nameInput" placeholder="Nhập tên">

<br><br>

<button id="add" onclick="addName()">Thêm</button>
<button id="clear" onclick="clearList()">Xóa hết</button>

<h3>Danh sách</h3>

<ul id="list"></ul>

<button id="spin" onclick="spin()">Quay!</button>

<div id="result"></div>

</div>

<script>

let names = []

function addName(){

    let input = document.getElementById("nameInput")
    let name = input.value

    if(name === "") return

    names.push(name)

    updateList()

    input.value = ""
}

function updateList(){

    let list = document.getElementById("list")

    list.innerHTML = ""

    for(let i=0;i<names.length;i++){

        list.innerHTML += "<li>"+names[i]+"</li>"

    }

}

function spin(){

    if(names.length === 0){
        alert("Chưa có tên!")
        return
    }

    let random = Math.floor(Math.random()*names.length)

    let winner = names[random]

    document.getElementById("result").innerText =
    "🎉 Người trúng: " + winner
}

function clearList(){

    names = []

    updateList()

    document.getElementById("result").innerText=""
}

</script>

</body>
  </html>
